<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원과 현의 성질 무한 챌린지</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 10px; background-color: #f1f8e9; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Nanum Gothic', sans-serif; overflow: hidden; }
        #GAME_BOX { background-color: #ffffff; padding: 15px; border-radius: 25px; border: 5px solid #4caf50; width: 100%; max-width: 400px; box-sizing: border-box; min-height: 640px; position: relative; box-shadow: 0 15px 30px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
        .scr { display: none; flex: 1; }
        .scr.on { display: flex; flex-direction: column; justify-content: space-between; }
        
        #t-bar-box { width: 100%; height: 10px; background: #dcedc8; border-radius: 10px; margin-bottom: 10px; overflow: hidden; border: 1.5px solid #4caf50; }
        #t-bar-inner { width: 100%; height: 100%; background: linear-gradient(90deg, #8bc34a, #4caf50); transition: width 0.1s linear; }
        .st-bar { display: flex; justify-content: space-around; font-weight: bold; margin-bottom: 5px; color: #2e7d32; font-size: 1rem; }
        
        /* 캔버스 영역 */
        .canvas-container { display: flex; justify-content: center; align-items: center; background: #fafafa; border: 2px solid #c8e6c9; border-radius: 15px; margin: 5px 0; padding: 5px; }
        canvas { display: block; }

        .pr { font-size: 1.1rem; margin: 5px 0; text-align: center; color: #1b5e20; font-weight: 700; word-break: keep-all; line-height: 1.4; min-height: 45px; display: flex; align-items: center; justify-content: center; }
        
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 5px; }
        .opt-btn { font-size: 1.1rem; padding: 8px; background: #fff; border: 2.5px solid #4caf50; border-radius: 15px; cursor: pointer; font-weight: bold; color: #2e7d32; transition: all 0.2s; min-height: 55px; display: flex; align-items: center; justify-content: center; }
        .opt-btn .mjx-chtml { font-size: 0.9em !important; } 

        #fb-msg { margin-top: 5px; font-weight: bold; min-height: 3.5em; font-size: 1rem; line-height: 1.4; display: flex; align-items: center; justify-content: center; border: 2px dashed #4caf50; border-radius: 12px; background: #f9fbf9; padding: 5px; text-align: center; }
        .start-btn { font-size: 1.6rem; padding: 12px 40px; background: #4caf50; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 0 #388e3c; }
        .re-btn { font-size: 1.2rem; padding: 15px; background: #2e7d32; color: white; border: none; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
<div id="GAME_BOX">
    <audio id="bgm" loop preload="auto" src="bgm.mp3"></audio>
    <div id="S_START" class="scr on" style="justify-content: center; align-items: center; text-align: center;">
        <h1 style="color:#2e7d32; margin-top: 10px; font-size: 1.8rem;">⭕ 원과 현의 성질 챌린지</h1>
        <p style="color:#666; line-height:1.6; font-size: 1.05rem; margin-bottom: 25px;">
            수선, 이등분, 현의 길이와 거리!<br>
            <span style="color:#d32f2f; font-weight:bold;">시각 자료로 완벽하게 마스터하기 🚀</span>
        </p>
        <div><button id="GO_BTN" class="start-btn">도전 시작!</button></div>
    </div>

    <div id="S_QUIZ" class="scr">
        <div>
            <div id="t-bar-box"><div id="t-bar-inner"></div></div>
            <div class="st-bar">
                <div>Score: <span id="SCORE_VAL">0</span></div>
                <div>Time: <span id="TIME_VAL">90</span>s</div>
            </div>
            <div class="canvas-container">
                <canvas id="geoCanvas" width="280" height="150"></canvas>
            </div>
            <div id="P_TXT" class="pr"></div>
        </div>
        <div>
            <div id="O_BOX" class="btn-grid"></div>
            <div id="fb-msg">준비...</div>
        </div>
    </div>

    <div id="S_RES" class="scr" style="justify-content: center; align-items: center; text-align: center;">
        <h2 style="color:#2e7d32; font-size: 1.8rem;">🏁 미션 종료</h2>
        <p style="font-size: 2rem; margin: 15px 0;">최종 점수: <span id="FINAL_SCORE" style="color:#d32f2f;">0</span>점</p>
        <button id="RE_BTN" class="re-btn">다시 도전하기</button>
    </div>
</div>

<script>
(function() {
    var ans = "", score = 0, timeLeft = 90, timer = null, isPaused = false;
    const bgm = document.getElementById('bgm');
    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');

    function init() {
        document.getElementById('S_START').classList.remove('on');
        document.getElementById('S_RES').classList.remove('on');
        document.getElementById('S_QUIZ').classList.add('on');
        score = 0; timeLeft = 90; isPaused = false;
        bgm.volume = 0.3; bgm.play().catch(e => {});
        updateUI(); make();
        if(timer) clearInterval(timer);
        timer = setInterval(function() {
            if(!isPaused) {
                timeLeft--; updateUI();
                if(timeLeft <= 0) endGame();
            }
        }, 1000);
    }

    function updateUI() {
        document.getElementById('SCORE_VAL').innerText = score;
        document.getElementById('TIME_VAL').innerText = timeLeft;
        document.getElementById('t-bar-inner').style.width = (timeLeft / 90 * 100) + "%";
    }

    // 캔버스에 기하학 도형 그리기 함수
    function drawCanvas(type, data) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cx = 140, cy = 75, R = 60;

        // 1. 원본 원 그리기
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, 2 * Math.PI);
        ctx.strokeStyle = '#2e7d32';
        ctx.lineWidth = 2.5;
        ctx.fillStyle = '#f1f8e9';
        ctx.fill();
        ctx.stroke();

        // 중심점 O
        ctx.beginPath();
        ctx.arc(cx, cy, 3, 0, 2 * Math.PI);
        ctx.fillStyle = '#d32f2f';
        ctx.fill();
        ctx.font = 'bold 12px Nanum Gothic';
        ctx.fillStyle = '#d32f2f';
        ctx.fillText("O", cx + 5, cy - 5);

        if (type === 0 || type === 1) {
            // 현과 수선 (중심에서 현에 내린 수선은 현을 이등분한다)
            // 현의 수직거리 d를 아래쪽으로 설정
            let d = data.d; // 예: 30
            let halfL = Math.sqrt(R*R - d*d);
            let ax = cx - halfL, ay = cy + d;
            let bx = cx + halfL, by = cy + d;
            let hx = cx, hy = cy + d; // 수선의 발 H

            // 현 AB
            ctx.beginPath();
            ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
            ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 2; ctx.stroke();

            // 반지름 OA
            ctx.beginPath();
            ctx.moveTo(cx, cy); ctx.lineTo(ax, ay);
            ctx.strokeStyle = '#1976d2'; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);

            // 수선 OH
            ctx.beginPath();
            ctx.moveTo(cx, cy); ctx.lineTo(hx, hy);
            ctx.strokeStyle = '#e65100'; ctx.stroke();

            // 직각 표시 (H 근처)
            ctx.strokeStyle = '#e65100'; ctx.lineWidth = 1.5;
            ctx.strokeRect(hx - 6, hy - 10, 6, 6);

            // 점 라벨
            ctx.fillStyle = '#000';
            ctx.fillText("A", ax - 12, ay + 12);
            ctx.fillText("B", bx + 5, by + 12);
            ctx.fillText("H", hx + 5, hy - 2);

            // 치수 텍스트 표시
            ctx.fillStyle = '#1976d2';
            ctx.font = '11px Nanum Gothic';
            ctx.fillText(`반지름 r=${data.r}`, cx - 55, cy - 10);
            ctx.fillStyle = '#e65100';
            ctx.fillText(`거리 d=${d}`, cx + 8, cy + d/2 + 5);

        } else if (type === 2) {
            // 두 현의 길이가 같은 경우 중심까지의 거리 구하기
            // 위아래로 평행한 두 현 그림
            let d = 25;
            let halfL = Math.sqrt(R*R - d*d);
            
            // 현 1 (위쪽)
            ctx.beginPath();
            ctx.moveTo(cx - halfL, cy - d); ctx.lineTo(cx + halfL, cy - d);
            ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 2; ctx.stroke();

            // 현 2 (아래쪽)
            ctx.beginPath();
            ctx.moveTo(cx - halfL, cy + d); ctx.lineTo(cx + halfL, cy + d);
            ctx.stroke();

            // 중심에서 내린 수선들
            ctx.beginPath();
            ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - d);
            ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + d);
            ctx.strokeStyle = '#e65100'; ctx.setLineDash([2,2]); ctx.stroke(); ctx.setLineDash([]);

            ctx.fillStyle = '#e65100';
            ctx.font = '11px Nanum Gothic';
            ctx.fillText(`${data.dist}cm`, cx + 5, cy - d/2);
            ctx.fillText(`${data.dist}cm`, cx + 5, cy + d/2 + 10);
        }
    }

    function generateProblem() {
        const type = Math.floor(Math.random() * 3);
        let q = "", a = "", options = [], canvasData = {};

        if (type === 0) { 
            // 유형 1: 반지름과 거리가 주어질 때 현의 전체 길이 구하기 ($r^2 = d^2 + x^2$)
            let dVals = [3, 6, 8, 5];
            let xVals = [4, 8, 6, 12];
            let idx = Math.floor(Math.random() * dVals.length);
            let d = dVals[idx], x = xVals[idx];
            let r = Math.sqrt(d*d + x*x);
            let chordLen = 2 * x;

            q = `오른쪽 그림에서 원의 중심 O에서 현 AB에 내린 수선의 발을 H라 하자. \\(r=${r}, \\overline{OH}=${d}\\)일 때, 현 AB의 길이는?`;
            a = `${chordLen}`;
            canvasData = { r: r, d: d };

            for(let i=0; i<4; i++) {
                options.push((chordLen + (i+1)*2).toString());
            }
        } else if (type === 1) { 
            // 유형 2: 반지름과 현의 전체 길이가 주어질 때 중심에서 현까지의 거리 구하기
            let rVals = [5, 10, 13, 17];
            let xVals = [3, 6, 5, 8]; // 반쪽 현 길이
            let idx = Math.floor(Math.random() * rVals.length);
            let r = rVals[idx], x = xVals[idx];
            let d = Math.sqrt(r*r - x*x);
            let chordLen = 2 * x;

            q = `오른쪽 그림에서 \\(r=${r}, \\text{현 } AB = ${chordLen}\\)일 때, 중심 O에서 현 AB까지의 거리는?`;
            a = `${d}`;
            canvasData = { r: r, d: d };

            for(let i=0; i<4; i++) {
                options.push((d + i + 1).toString());
            }
        } else { 
            // 유형 3: 길이가 같은 두 현은 중심에서 같은 거리에 있다.
            let dist = Math.floor(Math.random() * 6) + 3;
            q = `오른쪽 그림에서 두 현 AB와 CD의 길이가 같고, 한 현까지의 거리가 ${dist}cm일 때, 다른 현에서 중심 O까지의 거리는?`;
            a = `${dist}cm`;
            canvasData = { dist: dist };

            for(let i=0; i<4; i++) {
                options.push(`${dist + i + 1}cm`);
            }
        }
        
        drawCanvas(type, canvasData);

        options[0] = a;
        let uniqueOpts = [...new Set(options)];
        while(uniqueOpts.length < 4) {
            uniqueOpts.push((Math.floor(Math.random() * 20) + 2).toString() + (type === 2 ? "cm" : ""));
            uniqueOpts = [...new Set(uniqueOpts)];
        }
        uniqueOpts.sort(() => Math.random() - 0.5);
        return { q, a, opts: uniqueOpts };
    }

    function make() {
        isPaused = false;
        const msg = document.getElementById('fb-msg');
        msg.innerHTML = "정답을 선택해 주세요!";
        msg.style.backgroundColor = "#f9fbf9";
        
        const prob = generateProblem();
        document.getElementById('P_TXT').innerHTML = prob.q;
        ans = prob.a;
        
        const box = document.getElementById('O_BOX'); box.innerHTML = "";
        prob.opts.forEach(v => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn'; btn.innerHTML = v;
            btn.onclick = () => { if(!isPaused) check(v); };
            box.appendChild(btn);
        });

        if (window.MathJax) MathJax.typesetPromise();
    }

    function check(v) {
        const fb = document.getElementById('fb-msg');
        if(v === ans) {
            isPaused = true; score += 100;
            fb.innerHTML = "<span style='color:blue;'>참 잘했어요! +100 ✨</span>";
            fb.style.backgroundColor = "#e8f5e9";
            setTimeout(() => { make(); }, 800); 
        } else {
            score = Math.max(0, score - 100);
            fb.innerHTML = "<span style='color:red;'>아쉬워요! -100💀<br>정답: " + ans + "</span>";
            fb.style.backgroundColor = "#ffebee";
            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(b => b.style.opacity = "0.5");
            if (window.MathJax) MathJax.typesetPromise();
            setTimeout(() => { make(); }, 2000); 
        }
        updateUI();
    }

    function endGame() {
        clearInterval(timer); bgm.pause();
        document.getElementById('S_QUIZ').classList.remove('on');
        document.getElementById('S_RES').classList.add('on');
        document.getElementById('FINAL_SCORE').innerText = score;
    }

    document.getElementById('GO_BTN').onclick = init;
    document.getElementById('RE_BTN').onclick = init;
})();
</script>
</body>
</html>
