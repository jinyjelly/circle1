<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원과 현의 성질</title>
    <style>
        body { margin: 0; padding: 10px; background: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .box { width: 100%; max-width: 360px; text-align: center; border: 2px solid #333; border-radius: 12px; padding: 15px; box-sizing: border-box; }
        canvas { background: #f9f9f9; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
        .q-text { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: #111; line-height: 1.4; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn { padding: 12px; font-size: 16px; font-weight: bold; background: #fff; border: 2px solid #4caf50; border-radius: 8px; cursor: pointer; color: #2e7d32; }
        .btn:active { background: #e8f5e9; }
        #score { font-size: 14px; font-weight: bold; color: #555; margin-bottom: 8px; text-align: right; }
        #result { margin-top: 10px; font-size: 14px; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

<div class="box">
    <div id="score">점수: <span id="s-val">0</span></div>
    <canvas id="cv" width="330" height="200"></canvas>
    <div id="q-txt" class="q-text"></div>
    <div class="btn-grid" id="btns"></div>
    <div id="result"></div>
</div>

<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let score = 0, currentAnswer = 0;

function generateProblem() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = 165, cy = 100, R_pixel = 75; // 화면에 그려질 원의 반지름 (픽셀)

    // 원 그리기
    ctx.beginPath();
    ctx.arc(cx, cy, R_pixel, 0, 2 * Math.PI);
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 중심 O
    ctx.beginPath();
    ctx.arc(cx, cy, 3, 0, 2 * Math.PI);
    ctx.fillStyle = '#d32f2f';
    ctx.fill();
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText("O", cx + 6, cy - 6);

    const type = Math.floor(Math.random() * 3);
    let qText = "", ans = 0, options = [];

    if (type === 0) {
        // 유형 1: 반지름과 거리가 주어질 때 현의 길이
        const dataList = [
            {r: 5, d: 3, x: 4},
            {r: 10, d: 6, x: 8},
            {r: 13, d: 5, x: 12},
            {r: 10, d: 8, x: 6}
        ];
        const data = dataList[Math.floor(Math.random() * dataList.length)];
        ans = 2 * data.x;

        drawChord(cx, cy, R_pixel, data.r, data.d, data.x, data.r, data.d);
        qText = `반지름 r = ${data.r}, 거리 OH = ${data.d} 일 때, 현 AB의 길이는?`;

    } else if (type === 1) {
        // 유형 2: 반지름과 현의 길이가 주어질 때 거리
        const dataList = [
            {r: 5, x: 3, d: 4},
            {r: 10, x: 8, d: 6},
            {r: 13, x: 5, d: 12},
            {r: 10, x: 6, d: 8}
        ];
        const data = dataList[Math.floor(Math.random() * dataList.length)];
        ans = data.d;

        drawChord(cx, cy, R_pixel, data.r, data.d, data.x, data.r, "?");
        qText = `반지름 r = ${data.r}, 현 AB = ${2*data.x} 일 때, 거리 OH는?`;

    } else {
        // 유형 3: 길이가 같은 두 현
        const d = Math.floor(Math.random() * 5) + 3;
        ans = d;
        
        let r = 13;
        let x = Math.sqrt(r*r - d*d);
        let scale = R_pixel / r;
        let d_p = d * scale;
        let halfL_p = x * scale;

        // 평행한 두 현 그리기
        ctx.beginPath();
        ctx.moveTo(cx - halfL_p, cy - d_p); ctx.lineTo(cx + halfL_p, cy - d_p);
        ctx.moveTo(cx - halfL_p, cy + d_p); ctx.lineTo(cx + halfL_p, cy + d_p);
        ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();

        // 중심에서 내린 수선
        ctx.beginPath();
        ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - d_p);
        ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + d_p);
        ctx.strokeStyle = '#d32f2f'; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);

        ctx.font = '12px sans-serif'; ctx.fillStyle = '#d32f2f';
        ctx.fillText(`${d}cm`, cx + 6, cy - d_p/2);
        qText = `두 현의 길이가 같고 한 거리가 ${d}cm일 때, 다른 현까지의 거리는?`;
    }

    currentAnswer = ans;
    document.getElementById('q-txt').innerText = qText;

    options = [ans];
    while(options.length < 4) {
        let fake = ans + (Math.floor(Math.random() * 6) - 3);
        if(fake > 0 && !options.includes(fake)) options.push(fake);
    }
    options.sort(() => Math.random() - 0.5);

    const btnBox = document.getElementById('btns');
    btnBox.innerHTML = "";
    options.forEach(val => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = val;
        btn.onclick = () => check(val);
        btnBox.appendChild(btn);
    });
}

function drawChord(cx, cy, R_pixel, mathR, mathD, mathX, rText, dText) {
    let scale = R_pixel / mathR;
    let d_p = mathD * scale;
    let halfL_p = mathX * scale;
    let hY = cy + d_p;
    let ax = cx - halfL_p, bx = cx + halfL_p;
    
    // 현 AB
    ctx.beginPath();
    ctx.moveTo(ax, hY); ctx.lineTo(bx, hY);
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.stroke();

    // 반지름 OA
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(ax, hY);
    ctx.strokeStyle = '#1976d2'; ctx.setLineDash([3,3]); ctx.stroke(); ctx.setLineDash([]);

    // 수선 OH
    ctx.beginPath();
    ctx.moveTo(cx, cy); ctx.lineTo(cx, hY);
    ctx.strokeStyle = '#d32f2f'; ctx.stroke();

    // 직각 표시
    ctx.strokeRect(cx - 6, hY - 8, 6, 6);

    // 라벨
    ctx.font = 'bold 12px sans-serif';
    ctx.fillStyle = '#000';
    ctx.fillText("A", ax - 12, hY + 14);
    ctx.fillText("B", bx + 5, hY + 14);
    ctx.fillText("H", cx + 5, hY - 2);

    ctx.fillStyle = '#1976d2';
    ctx.fillText(`r=${rText}`, cx - 55, cy - 10);
    ctx.fillStyle = '#d32f2f';
    ctx.fillText(`${dText}`, cx + 6, cy + d_p / 2);
}

function check(val) {
    const res = document.getElementById('result');
    if(val === currentAnswer) {
        score += 100;
        res.style.color = 'blue';
        res.innerText = "정답! ✨";
        document.getElementById('s-val').innerText = score;
        setTimeout(() => { res.innerText = ""; generateProblem(); }, 600);
    } else {
        res.style.color = 'red';
        res.innerText = `오답! 정답은 ${currentAnswer}`;
        setTimeout(() => { res.innerText = ""; generateProblem(); }, 1200);
    }
}

generateProblem();
</script>

</body>
</html>
